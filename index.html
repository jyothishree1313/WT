<html ng-app="MyApp">
    <head>
        <title>Inventory Sys</title>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"> </script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>

        <style>
            .ng-enter{
                transition: 1s;
                opacity:0;
            }
            .ng-enter-active{
                opacity:1;
            }
            .ng-leave{
                transition:1s;
                opacity:1;
            }
            .ng-leave-active{
                opacity:0;
            }
        </style>
    </head>
    <body ng-controller="MyCtrl">

        <h2>Inventory System</h2>
        <product-dir></product-dir>
        <br><br>

        Product ID:
        <input type="number" ng-model="id">
        <br><br>

        Product Name:
        <input type="text" ng-model="name">
        <br><br>

        Quantity:
        <input type="number" ng-model="quantity">
        <br><br>

        Price:
        <input type="number" ng-model="price">
        <br><br>
    
        <button ng-click="add()">Add</button>

        <h3>Search Product </h3>
        <br>

        Product name:
        <input ng-model="search" placeholder="search.....">
        <br>

        <h3>Product list</h3>

        <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        <tr ng-repeat="p in products | filter:search">
            <td>{{p.id}}</td>
            <td>{{p.name}}</td>
            <td>{{p.quantity}}</td>
            <td>{{p.price}}</td>
            <td>
                <button ng-click="delete(p)">Delete</button>
                <button ng-click="update(p)">Update</button>
            </td>
        </tr>
        </table>


        <script>
            var app=angular.module("MyApp",["ngAnimate"])


            app.directive("productDir",function(){
                return{
                    template: "<p> Welcome to the Inventory Management Page</p>"
                }
            })

            app.factory("ProductFactory",function(){
                return{
                    create: function(id,name,quantity,price)
                    {
                        return{
                            id:Number(id),
                            name:name,
                            quantity:Number(quantity),
                            price:Number(price)
                        }
                    }
                }
            })

            app.service("ProductService",function(){
                this.products=[];
            })
            app.controller("MyCtrl",function($http,$scope,ProductService,ProductFactory)
            {
                $scope.products=ProductService.products;
                $scope.editId=null

                $scope.loadProducts=function()
                {
                    $http.get("/products").then(function(response){
                        $scope.products=response.data;
                        ProductService.products=$scope.products;
                    });
                }

                $scope.add=function(){
                    if(!$scope.id || !$scope.name || $scope.quantity<0 || $scope.price<0){
                        alert("Enter valid product details...")
                        return;
                    }

                    var product=ProductFactory.create(
                        $scope.id,
                        $scope.name,$scope.quantity,
                        $scope.price
                    );

                    var exists=$scope.products.some(function(p){
                        return p.id==product.id && p._id!=$scope.editId;
                    });

                    if (exists){
                        alert("Product ID already exists");
                        return;
                    }
                    var request;

                    if($scope.editId){
                        request=$http.put("/products/"+$scope.editId,product);
                    }else{
                        request=$http.post("/products",product);
                    }

                    request.then(function()
                    {
                        $scope.editId=null;
                        $scope.id="";
                        $scope.name="";
                        $scope.quantity="";
                        $scope.price="";
                        $scope.loadProducts();
                    });
                };
                

                $scope.delete=function(p){
                    $http.delete("/products/"+p._id).then(function(){
                        $scope.loadProducts();
                    })
                }
                

                $scope.update=function(p)
                {
                                       
                    $scope.editId=p._id;

                    $scope.id=p.id;
                    $scope.name=p.name;
                    $scope.quantity=p.quantity;
                    $scope.price=p.price;
                    
                };

                $scope.loadProducts();

            });
        </script>
    </body>
</html>
